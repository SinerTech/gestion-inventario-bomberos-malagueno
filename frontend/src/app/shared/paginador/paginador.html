@if (totalElementos > 0) {
    <nav class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3 text-white"
        aria-label="Paginación">
        <small>Mostrando {{ desde }}-{{ hasta }} de {{ totalElementos }}</small>

        @if (totalPaginas > 1) {
            <div class="d-flex gap-1">
                <button type="button" class="btn btn-secondary btn-sm" [disabled]="paginaActual === 1"
                    (click)="ir(paginaActual - 1)" title="Anterior">
                    <i class="bi bi-chevron-left"></i>
                </button>
                @for (p of paginas; track p) {
                    <button type="button" class="btn btn-primary btn-sm"
                        [class.active]="p === paginaActual" (click)="ir(p)">
                        {{ p }}
                    </button>
                }
                <button type="button" class="btn btn-secondary btn-sm" [disabled]="paginaActual === totalPaginas"
                    (click)="ir(paginaActual + 1)" title="Siguiente">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        }
    </nav>
}
